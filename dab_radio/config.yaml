name: DAB Radio
version: "0.1.0"
slug: dab_radio
description: >-
  welle-cli DAB/DAB+ receiver tuned via a remote rtl_tcp source (the RTL-SDR
  dongle stays wherever rtl_tcp runs -- this add-on never touches USB).
  Exposes a REST API the dab_radio custom component uses for station
  listing and tuning.
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ports:
  8080/tcp: 8080
  9000/tcp: 9000
ports_description:
  8080/tcp: welle-cli's own REST API and audio stream endpoints
  9000/tcp: Controller REST API used by the dab_radio integration
options:
  rtltcp_host: ""
  rtltcp_port: 1234
  start_channel: "12B"
  channels: "10B,11A,11D,12B"
  public_base_url: ""
  gain: "22"
schema:
  rtltcp_host: str
  rtltcp_port: port
  start_channel: str
  channels: str
  public_base_url: str
  gain: str
